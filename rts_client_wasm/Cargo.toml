[package]
name = "rts_client_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"] # Compile to dynamic library for WASM

[dependencies]
rts_core = { path = "../rts_core" } # Link to core crate

wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    'Window', 'Document', 'Element', 'HtmlCanvasElement', 'console',
    'WebSocket', 'MessageEvent', 'ErrorEvent', 'CloseEvent',
    # Add more Web API features as needed for rendering, input, etc.
    # 'WebGlRenderingContext', 'WebGl2RenderingContext',
]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" # Or bincode/other if using binary format
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4" # To await JavaScript promises
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }


# Optional: Game engine like Bevy (requires more setup)
# bevy = { version = "0.12", default-features = false, features = ["bevy_render", "bevy_core_pipeline", "bevy_asset", "bevy_winit", "bevy_pbr", "wasm-bindgen"] }
