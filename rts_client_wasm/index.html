<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTS Game (WASM)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <!-- Loading script generated by wasm-pack -->
    <script type="module">
        import init from './pkg/rts_client_wasm.js';

        async function run() {
            // Initialize the WASM module
            await init();
            // Note: The `start()` function in lib.rs is usually called automatically
            // if it's annotated correctly with #[wasm_bindgen(start)].
            // You might call specific exported functions here if needed.
            console.log("WASM Initialized");
        }
        run();
    </script>
</body>
</html>
